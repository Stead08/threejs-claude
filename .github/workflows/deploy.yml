name: Deploy

# main への push で Cloudflare Workers (Static Assets) にデプロイする。
# 必要なリポジトリシークレット:
#   CLOUDFLARE_API_TOKEN  … "Workers Scripts:Edit" 権限を持つ API トークン
#   CLOUDFLARE_ACCOUNT_ID … Cloudflare ダッシュボードのアカウント ID
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      # ci.yml と同じく wasm-opt はここで明示実行する（crates/wasm 側で自動実行を無効化しているため）。
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - run: |
          wasm-opt -Os -all \
            -o packages/engine/wasm-pkg/rhythm_wasm_bg.wasm \
            packages/engine/wasm-pkg/rhythm_wasm_bg.wasm
      - run: pnpm build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy
