name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      # crates/wasm は wasm-pack の wasm-opt 自動実行を無効化している
      # (開発サンドボックスで binaryen の DL が egress 遮断されるため)。
      # CI では apt の binaryen で明示的にサイズ最適化し、gz サイズを記録する。
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - run: |
          wasm-opt -Os -all \
            -o packages/engine/wasm-pkg/rhythm_wasm_bg.wasm \
            packages/engine/wasm-pkg/rhythm_wasm_bg.wasm
          gzip -9 -c packages/engine/wasm-pkg/rhythm_wasm_bg.wasm | wc -c \
            | xargs -I{} echo "wasm gz size: {} bytes (budget 400000)"
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm depcruise
      - run: pnpm build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # 失敗時は error-context（ARIA スナップショット）をログへ直接出す。
      # アーティファクト取得が難しい環境からでもログだけで画面状態を判別できる。
      - name: Dump e2e failure context
        if: failure()
        run: |
          find apps/web/test-results -name 'error-context.md' -print -exec cat {} \; || true
      # 失敗時はトレース（スクリーンショット・コンソール・ネットワーク込み）を回収して
      # CI 環境でしか再現しない問題を手元で解析できるようにする。
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
