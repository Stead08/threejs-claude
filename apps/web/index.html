<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>カラテや</title>
    <style>
      /* M0-SPEC §9: 全画面固定 / touch-action:none / dvh / safe-area-inset 対応のダークシェル。 */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100dvh;
        background: #0a0a12;
        color: #f5f5f7;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100dvh;
        display: block;
        touch-action: none;
        background: #0a0a12;
      }
      /*
       * #root は React シェルのオーバレイ。既定では pointer-events:none にして
       * canvas（ゲーム本体）へタッチを素通しし、各画面（Title/Loading/Result/Settings/
       * OrientationWarning）が自分自身の要素で pointer-events:auto を明示して
       * タップを受け取る（M0-SPEC §9「pointer-events は画面に応じ制御」）。
       */
      #root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100dvh;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
