[workspace]
resolver = "2"
members = ["crates/core", "crates/synth", "crates/wasm", "crates/tools"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
midly = "0.5"
rustysynth = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
